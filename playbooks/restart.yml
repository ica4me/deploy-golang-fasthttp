---
- name: Restart all managed FastHTTP containers
  hosts: fasthttp_backends
  become: true
  gather_facts: false
  tasks:
    - name: Restart containers
      ansible.builtin.command: "docker restart fasthttp-{{ item }}"
      loop: "{{ range(1, (backend_container_count | int) + 1) | list }}"
      changed_when: true
